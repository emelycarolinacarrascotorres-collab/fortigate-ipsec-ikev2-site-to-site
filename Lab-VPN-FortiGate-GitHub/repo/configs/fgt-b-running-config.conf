# =====================================================================
# FortiGate B (FTG-B) - Configuracion equivalente a lo hecho por GUI
# NOTA: reconstruida a partir de las capturas de la GUI. Para el
# archivo oficial reemplazar por la salida de:  show full-configuration
# (o System > Config > Backup). La PSK NO se publica.
# =====================================================================
config system interface
    edit "port1"
        set mode static
        set ip 20.25.97.2 255.255.255.252
        set allowaccess ping https ssh http fgfm
    next
    edit "port2"
        set alias "LAN-SERVER"
        set ip 10.25.97.1 255.255.255.240
        set allowaccess ping
    next
    edit "port3"
        set ip 192.168.98.1 255.255.255.0
        set allowaccess ping https ssh http
    next
end
config firewall address
    edit "USERS-NET"
        set subnet 10.25.6.0 255.255.255.128
    next
    edit "FTG-B"
        set subnet 10.25.97.0 255.255.255.240
    next
end
config vpn ipsec phase1-interface
    edit "VPN-B-to-A"
        set interface "port1"
        set ike-version 2
        set peertype any
        set proposal des-sha256
        set dhgrp 14
        set nattraversal disable
        set dpd on-demand
        set dpd-retrycount 3
        set dpd-retryinterval 20
        set remote-gw 20.25.6.2
        set keylife 86400
        set psksecret <PSK_OCULTA>
    next
end
config vpn ipsec phase2-interface
    edit "VPN-B-to-A"
        set phase1name "VPN-B-to-A"
        set src-subnet 10.25.97.0 255.255.255.240
        set dst-subnet 10.25.6.0 255.255.255.128
    next
end
config firewall policy
    edit 1
        set name "LAN-to-VPN"
        set srcintf "port2"
        set dstintf "VPN-B-to-A"
        set srcaddr "FTG-B"
        set dstaddr "USERS-NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic utm
        set nat disable
    next
    edit 2
        set name "VPN-to-LAN"
        set srcintf "VPN-B-to-A"
        set dstintf "port2"
        set srcaddr "USERS-NET"
        set dstaddr "FTG-B"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic utm
        set nat disable
    next
    edit 3
        set name "LAN-to-WAN"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic utm
        set nat enable
    next
end
config router static
    edit 1
        set gateway 20.25.97.1
        set device "port1"
        set comment "Ruta Estatico"
    next
    edit 2
        set dst 10.25.6.0 255.255.255.128
        set gateway 20.25.6.2
        set device "VPN-B-to-A"
        set distance 10
        set comment "Ruta al tunel VPN"
    next
    edit 3
        set dst 10.25.6.0 255.255.255.128
        set blackhole enable
        set distance 254
        set comment "Blackhole si cae la VPN"
    next
end
