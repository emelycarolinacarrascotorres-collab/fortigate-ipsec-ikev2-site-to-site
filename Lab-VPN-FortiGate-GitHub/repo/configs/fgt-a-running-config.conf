# =====================================================================
# FortiGate A (FTG-A) - Configuracion equivalente a lo hecho por GUI
# NOTA: reconstruida a partir de las capturas de la GUI. Para el
# archivo oficial reemplazar por la salida de:  show full-configuration
# (o System > Config > Backup). La PSK NO se publica.
# =====================================================================
config system interface
    edit "port1"
        set alias "WAN"
        set mode static
        set ip 20.25.6.2 255.255.255.252
        set allowaccess ping https ssh http fgfm
    next
    edit "port3"
        set ip 192.168.99.1 255.255.255.0
        set allowaccess ping https ssh http
    next
    edit "VLAN10_USUARIOS"
        set alias "LAN"
        set role lan
        set interface "port2"
        set vlanid 10
        set ip 10.25.6.1 255.255.255.128
        set allowaccess ping
    next
end
config system dhcp server
    edit 1
        set interface "VLAN10_USUARIOS"
        set default-gateway 10.25.6.1
        set netmask 255.255.255.128
        config ip-range
            edit 1
                set start-ip 10.25.6.10
                set end-ip 10.25.6.100
            next
        end
    next
end
config firewall address
    edit "USERS-NET"
        set subnet 10.25.6.0 255.255.255.128
    next
    edit "SERVER-NET"
        set subnet 10.25.97.0 255.255.255.240
    next
end
config vpn ipsec phase1-interface
    edit "VPN-A-to-B"
        set interface "port1"
        set ike-version 2
        set peertype any
        set proposal des-sha256
        set dhgrp 14
        set nattraversal disable
        set dpd on-demand
        set dpd-retrycount 3
        set dpd-retryinterval 20
        set remote-gw 20.25.97.2
        set keylife 86400
        set psksecret <PSK_OCULTA>
    next
end
config vpn ipsec phase2-interface
    edit "VPN-A-to-B"
        set phase1name "VPN-A-to-B"
        set src-subnet 10.25.6.0 255.255.255.128
        set dst-subnet 10.25.97.0 255.255.255.240
    next
end
config firewall policy
    edit 1
        set name "LAN-to-VPN"
        set srcintf "VLAN10_USUARIOS"
        set dstintf "VPN-A-to-B"
        set srcaddr "USERS-NET"
        set dstaddr "SERVER-NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic utm
        set nat disable
    next
    edit 2
        set name "VPN-to-LAN"
        set srcintf "VPN-A-to-B"
        set dstintf "VLAN10_USUARIOS"
        set srcaddr "SERVER-NET"
        set dstaddr "USERS-NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic utm
        set nat disable
    next
    edit 3
        set name "LAN-to-WAN"
        set srcintf "VLAN10_USUARIOS"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "no-inspection"
        set logtraffic utm
        set nat enable
    next
end
config router static
    edit 1
        set gateway 20.25.6.1
        set device "port1"
        set comment "Ruta estatica"
    next
    edit 2
        set dst 10.25.97.0 255.255.255.240
        set gateway 20.25.97.2
        set device "VPN-A-to-B"
        set distance 10
    next
    edit 3
        set dst 10.25.97.0 255.255.255.240
        set blackhole enable
        set distance 254
    next
end
